<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinTech Panel</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><section class="brand"><span class="mark">LT</span><div><h1>LinTech Panel</h1><p>Secure hosting operations, without the clutter.</p></div></section><section class="card" id="login"><h2>Sign in</h2><form><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Continue</button><p role="alert" id="error"></p></form></section><section class="card hidden" id="dashboard"><div class="top"><div><p class="eyebrow">OVERVIEW</p><h2 id="welcome">Dashboard</h2></div><button class="secondary" id="logout">Sign out</button></div><div class="grid"><article><span>Domains</span><strong id="domains">—</strong></article><article><span>Jobs</span><strong id="jobs">—</strong></article><article><span>Security</span><strong>Protected</strong></article></div><h3>Recent jobs</h3><div id="job-list" class="empty">No jobs yet.</div></section></main><script type="module" src="/app.js"></script></body></html>
